<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Default Audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Palette (rev10, "cool and crisp"; checked with the dataviz validator):
   role      reference A #2563eb, focus B #f97316 (pass: CVD 32.8, normal 41.5); further members of the comparison set
             are ink, told apart by position (rows, lanes, axes, small multiples) and direct labels, never by hue
   poles     teal #0d9488 <-> ochre #a16207 (pass against A and B in all pairs), grey midpoint
   status    good #0ca30c, critical #d03b3b, warning #e0a100 (reference status steps; never colour alone: every status
             mark carries a symbol or a shape), muted for "no shift"
   selection ink (a dark ring), so no extra hue competes with A and B */
:root {
  color-scheme: light;
  --page: #f3f6fa; --panel: #ffffff; --ink: #0b1220; --ink-2: #3d4a5c; --muted: #8792a6; --faint: #cfd6e2;
  --grid: #e8edf4; --band: rgba(37,99,235,.055); --dot: #b3bdcc;
  --a: #2563eb; --b: #f97316; --hl: #0b1220; --warn: #e0a100; --ok: #0ca30c; --bad: #d03b3b;
  --shadow: 0 0 0 1px #e3e8f0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0a0e15; --panel: #111827; --ink: #e8edf5; --ink-2: #b4bfd0; --muted: #7d889c; --faint: #2b3445;
    --grid: #1c2433; --band: rgba(96,165,250,.08); --dot: #4b5568; --a: #3b82f6; --b: #f97316; --hl: #e8edf5; --warn: #fab219; --ok: #22c55e; --bad: #ef4444;
    --shadow: 0 0 0 1px #1f2937;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0a0e15; --panel: #111827; --ink: #e8edf5; --ink-2: #b4bfd0; --muted: #7d889c; --faint: #2b3445;
  --grid: #1c2433; --band: rgba(96,165,250,.08); --dot: #4b5568; --a: #3b82f6; --b: #f97316; --hl: #e8edf5; --warn: #fab219; --ok: #22c55e; --bad: #ef4444;
  --shadow: 0 0 0 1px #1f2937;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-feature-settings: "tnum"; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; padding: 12px 16px 14px;
  min-width: 1280px; min-height: 760px; height: 100vh; overflow: hidden; }
/* header */
header { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; row-gap: 6px; }
header h1 { font-size: 18px; font-weight: 650; margin: 0 8px 0 0; letter-spacing: -.01em; white-space: nowrap; }
.pill { display: flex; align-items: center; gap: 8px; background: var(--panel); border-radius: 999px; padding: 5px 8px 5px 12px; box-shadow: var(--shadow); }
.pill i { width: 10px; height: 10px; border-radius: 50%; display: block; flex: none; }
.pill select { border: 0; background: transparent; font: inherit; font-weight: 600; color: var(--ink); outline: none; cursor: pointer; }
.iconbtn { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--panel); box-shadow: var(--shadow); color: var(--ink-2); font-size: 15px; cursor: pointer; flex: none; }
.diff { display: flex; gap: 6px; min-width: 0; overflow: hidden; }
.diff span { font-size: 12px; color: var(--ink-2); background: var(--panel); border-radius: 999px; padding: 3px 10px; box-shadow: var(--shadow); white-space: nowrap; }
.diff span.warn { color: var(--warn); font-weight: 600; }
.diff span { max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
.seg { display: flex; gap: 2px; background: var(--panel); border-radius: 999px; padding: 3px; box-shadow: var(--shadow); margin-left: auto; flex: none; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.seg button.on { background: var(--ink); color: var(--panel); font-weight: 600; }
.status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; flex: none; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); display: inline-block; }
/* layout: main view (configuration map) + auxiliary views */
#app { display: grid; gap: 10px; min-height: 0;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) clamp(230px, 18vw, 320px);
  grid-template-rows: minmax(0, 1.6fr) minmax(0, 1fr);
  grid-template-areas: "map matrix side" "strip ridge side"; }
.card { background: var(--panel); border-radius: 10px; box-shadow: var(--shadow); min-width: 0; min-height: 0; display: flex; flex-direction: column; transition: box-shadow .2s; }
.card h2 { font-size: 12.5px; font-weight: 600; margin: 0; padding: 9px 12px 0; display: flex; align-items: center; gap: 7px; flex: none; color: var(--ink-2); }
#mapCard h2 { font-size: 15px; color: var(--ink); padding-top: 11px; }
.pl { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 5px; background: var(--ink-2); color: var(--panel); font-size: 10.5px; font-weight: 700; flex: none; }
#mapCard .pl { background: var(--ink); width: 19px; height: 19px; }
.card h2 small { color: var(--muted); font-weight: 400; font-size: 12px; }
.card h2 select { margin-left: auto; font: inherit; font-size: 13px; font-weight: 500; border: 0; background: var(--page); border-radius: 999px; padding: 3px 10px; color: var(--ink); cursor: pointer; max-width: 55%; }
.card .body { flex: 1; min-height: 0; position: relative; }
#mapCard { grid-area: map; } #matrixCard { grid-area: matrix; } #stripCard { grid-area: strip; } #ridgeCard { grid-area: ridge; }
#side { grid-area: side; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
#side .card { flex: 1; cursor: pointer; }
#side .card.on { box-shadow: 0 0 0 1.5px var(--ink-2), var(--shadow); }
#side .card h2 { padding-top: 7px; font-size: 13px; }
svg { display: block; }
svg text { fill: var(--muted); font-size: 11px; font-family: inherit; }
.band { fill: var(--band); }
.zero { stroke: var(--faint); stroke-width: 1; }
.pole { font-size: 10.5px; fill: var(--muted); }
.figval { font-size: 11px; fill: var(--ink-2); font-weight: 500; }
.figax text { font-size: 10px; fill: var(--muted); }
.figax line, .figax path { stroke: var(--faint); }
.card h2 .est { margin-left: auto; font-size: 11.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
body:not(.fig) .figonly { display: none; }
/* map */
.cfg .pt { stroke: var(--panel); stroke-width: 1.5; cursor: pointer; }
.cfg .ring { fill: none; stroke-width: 2.5; }
.lab text { font-size: 13px; fill: var(--ink-2); font-weight: 500; paint-order: stroke; stroke: var(--panel); stroke-width: 3px; pointer-events: none; }
.arrow path.shaft { fill: none; stroke: var(--ink-2); stroke-width: 1.8; stroke-linecap: round; opacity: .7; }
.arrow path.hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
.arrow.package path.shaft { stroke-dasharray: 5 4; }
.arrow.prompt path.shaft { stroke-dasharray: 1.5 4; }
.cfg.rw .pt { fill-opacity: .45; }
.arrow:hover path.shaft { stroke: var(--hl); opacity: 1; stroke-width: 2.4; }
.detail path.link { fill: none; stroke-width: 1.2; opacity: .55; }
.detail path.mk { stroke: var(--panel); stroke-width: 1; }
/* matrix */
.mx rect.cell { cursor: pointer; }
.mx rect.cell:hover, .mx rect.cell.on { stroke: var(--ink); stroke-width: 1.5; }
.mx .rl { fill: var(--ink-2); cursor: pointer; }
.mx .rl.on { fill: var(--hl); font-weight: 600; }
.mx .cl { font-size: 11px; fill: var(--ink-2); font-weight: 500; }
/* contrast scatters */
.subj { fill: var(--dot); stroke: var(--panel); stroke-width: 1.2; cursor: pointer; }
.subj.on { fill: var(--hl); }
.ci { stroke: var(--hl); stroke-width: 2; stroke-linecap: round; opacity: 0; }
.ci.on { opacity: .55; }
.pool path { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.pool line { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; opacity: .8; }
/* ridge */
.ridge .area { stroke-width: 2; stroke-linejoin: round; }
.ridge .rowlab { fill: var(--ink-2); font-size: 13px; font-weight: 600; }
.ridge .row { cursor: pointer; }
.rug { stroke-width: 2.2; stroke-linecap: round; cursor: pointer; }
.rug.hl { stroke: var(--hl) !important; stroke-width: 3.5; }
/* strip */
#strip { padding: 2px 14px 10px; overflow: auto; }
.lane { display: grid; gap: 4px; margin: 4px 0 6px; }
.lane img { width: 100%; aspect-ratio: 1; display: block; border-radius: 6px; cursor: pointer; transition: transform .15s, box-shadow .15s; }
.lane img:hover { transform: scale(1.05); }
.lane img.hl { box-shadow: 0 0 0 3px var(--hl); }
.lanehead { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-weight: 600; font-size: 13px; color: var(--ink-2); }
.lanehead i { width: 10px; height: 10px; border-radius: 50%; }
.grad { height: 4px; border-radius: 2px; margin: 4px 0 2px; }
.ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
/* reversal detection and row ordering */
button.mini { border: 0; background: var(--page); color: var(--ink-2); border-radius: 999px; width: 26px; height: 24px; cursor: pointer; font-size: 14px; }
button.mini.on { background: var(--ink); color: var(--panel); }
#matrixCard h2 button.mini { margin-left: 6px; }
.revb { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); border-radius: 999px; padding: 2px 9px; cursor: pointer; display: none; }
.mx .rl.rev { fill: var(--bad); font-weight: 600; }
.mx .dbar.rev { stroke: var(--bad); stroke-width: 1.6; }
.mx .dmark { stroke: var(--faint); stroke-dasharray: 2 2; }
.subj.rev { stroke: var(--bad); stroke-width: 2; }
/* paired-seed trajectories */
.seg.mini { box-shadow: none; background: var(--page); margin-left: 6px; padding: 2px; }
.seg.mini button { padding: 1px 9px; font-size: 13px; }
.traj { fill: none; stroke: var(--dot); stroke-width: 1.3; opacity: .55; }
.traj.hl { stroke: var(--hl); stroke-width: 2.6; opacity: 1; }
.trajhit { fill: none; stroke: transparent; stroke-width: 8; cursor: pointer; }
.trajmed { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; opacity: .85; }
.cpt.ab.hl { stroke: var(--hl); stroke-width: 3; }
/* statement view */
#stmts { position: absolute; inset: 0; overflow: auto; padding: 6px 14px 12px; }
/* audit trail: claim -> measure -> subject -> images */
#trail { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 4px 12px 10px; gap: 8px; }
#trail .chain { flex: 1 1 auto; min-height: 0; display: flex; align-items: stretch; gap: 0; }
#trail .stage.s1 { flex-grow: 1; } #trail .stage.s2 { flex-grow: 1.15; } #trail .stage.s3 { flex-grow: 1; } #trail .stage.s4 { flex-grow: .9; }
#trail .stage { flex: 1 1 0; min-width: 0; border: 1px solid var(--grid); border-radius: 10px; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; background: var(--panel); }
#trail .stage h3 { margin: 0; font-size: 10.5px; font-weight: 600; color: var(--muted); letter-spacing: .03em; text-transform: uppercase; display: flex; gap: 6px; align-items: center; }
#trail .stage .viz { flex: 1 1 auto; min-height: 0; position: relative; }
#trail .rd { display: grid; grid-template-columns: 1fr; font-size: 12px; color: var(--ink-2); line-height: 1.3; }
#trail .rd span { font-size: 10.5px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
#trail .rd span i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
#trail .rd b { color: var(--ink); font-weight: 600; }
#trail .rd.ptr { margin-top: auto; font-size: 11px; color: var(--muted); }
#trail .stage .viz svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#trail .lnk { flex: 0 0 34px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
#trail .lnk b { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 13px; }
#trail .lnk span { font-size: 9.5px; color: var(--muted); text-align: center; line-height: 1.15; }
#trail .quote { font-size: 12.5px; line-height: 1.35; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
#trail .src { font-size: 16px; }
#trail .imgs { display: grid; grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; gap: 4px; flex: 1 1 auto; min-height: 0; }
#trail .imgs div { position: relative; min-height: 0; }
#trail .imgs img { width: 100%; height: 100%; object-fit: contain; border-radius: 6px; display: block; }
#trail .imgs i { position: absolute; left: 4px; top: 4px; width: 10px; height: 10px; border-radius: 50%; }
#trail .step { display: flex; gap: 4px; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); }
#trail .step button, #trail .uv button, #trail .tbar button { font: inherit; font-size: 12px; border: 1px solid var(--grid); background: var(--panel); color: var(--ink-2); border-radius: 6px; padding: 1px 7px; cursor: pointer; }
#trail .uv { display: flex; gap: 6px; justify-content: center; }
#trail .uv button.on.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
#trail .uv button.on.no { background: var(--bad); color: #fff; border-color: var(--bad); }
#trail .tbar { flex: 0 0 auto; display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); }
#trail .saved { flex: 0 1 auto; max-height: 32%; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
#trail .tr { display: grid; grid-template-columns: 18px 1fr auto auto auto auto 16px; gap: 6px; align-items: center; font-size: 11.5px; padding: 2px 6px; border-radius: 6px; cursor: pointer; }
#trail .tr:hover { background: var(--band); }
#trail .tr .q { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
#trail .tr .s { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 10px; }
#trail .tr .x { color: var(--muted); }
.stbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin: 6px 0 10px; }
.stbar div { height: 100%; }
.stctl { display: flex; gap: 6px; align-items: center; margin: 2px 0 4px; }
.stgrp { font-size: 12px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .04em; }
.stmt { display: grid; grid-template-columns: 12px 1fr; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; align-items: start; }
.stmt:hover { background: var(--band); }
.stmt.on { box-shadow: inset 0 0 0 2px var(--hl); }
.stmt i { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; display: block; }
.stmt .t { color: var(--ink); font-size: 13px; }
.stmt .m { color: var(--muted); font-size: 12px; }
.chipbtn { border: 0; background: var(--page); border-radius: 999px; padding: 3px 10px; margin: 3px; font: inherit; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.tip mark { background: color-mix(in srgb, var(--hl) 22%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }
/* image axis (replaces the sorted grid) */
#strip { padding: 0; overflow: hidden; }
g.axi { cursor: pointer; }
g.axi .axb { fill: none; stroke-width: 0; }
g.axi.sel .axb { stroke-width: 2.5; }
g.axi.hl .axb { stroke: var(--hl) !important; stroke-width: 3; }
g.axi.dim { opacity: .16; }
.axbrush .selection, .sbrush .selection, .rwbrush .selection { fill: var(--hl); fill-opacity: .12; stroke: var(--hl); stroke-opacity: .6; }
.axtrack { fill: var(--band); }
.traj.sel { stroke: var(--hl); stroke-width: 2.2; opacity: .95; }
.traj.dim { opacity: .07; }
.cpt.ab.dim { opacity: .15; }
.cpt.ab.sel { stroke: var(--hl); stroke-width: 2.5; }
.rug.sel { stroke: var(--hl) !important; stroke-width: 3; }
#stripName button.mini { margin-left: 4px; }
#selCount { font-size: 12px; font-weight: 600; color: var(--hl); background: color-mix(in srgb, var(--hl) 12%, transparent); border-radius: 999px; padding: 1px 8px; }
/* subject brushing and draggable margins */
.subj.dim { opacity: .18; }
.seld path { fill: none; stroke: var(--hl); stroke-width: 2.4; }
.mh { fill: var(--ink-2); opacity: .35; }
.mh:hover, .mh.drag { opacity: 1; fill: var(--hl); }
.mx .rl.pick { fill: var(--hl); font-weight: 600; text-decoration: underline; }
#mstat { cursor: pointer; color: var(--hl); font-weight: 600; display: none; }
/* aspects not validated by people on the configurations of the pair */
#side .card.nv .focusfx { opacity: .3; }
.nvmark { color: var(--warn); font-weight: 700; margin-left: auto; cursor: help; }
.seg button.nv { text-decoration: line-through; text-decoration-color: var(--warn); }
/* main view: focus + context */
.ctxA path, .ctxB path { stroke-linejoin: round; }
.cfg.ctx .pt { opacity: .5; }
.cfg.focus .pt { opacity: 1; }
.arrow.dim path.shaft { opacity: .18; }
.arrow.sel path.shaft { stroke: var(--ink); opacity: .9; stroke-width: 2.4; }
.arrow.adhoc path.shaft { stroke: var(--ink); opacity: .9; stroke-width: 2.2; stroke-dasharray: 8 2 1 2; }
/* aspect buttons carry the pair's verdict glyphs */
#aspSeg button { display: inline-flex; align-items: center; gap: 5px; }
#aspSeg svg.vg { width: 26px; height: 14px; overflow: visible; }
  box-shadow: 0 0 0 1px rgba(16,24,40,.08), 0 12px 32px rgba(16,24,40,.16); display: none; flex-direction: column; z-index: 8; }
/* drag to compare */
.dragline { fill: none; stroke: var(--hl); stroke-width: 2.2; stroke-dasharray: 5 4; pointer-events: none; }
.cfg { cursor: grab; }
/* statement verdicts by the user */
.stmt { grid-template-columns: 12px 1fr auto; }
.uv button { border: 0; background: var(--page); color: var(--muted); border-radius: 999px; width: 24px; height: 22px; margin-left: 3px; cursor: pointer; font-size: 12px; }
.uv button.on.ok { background: var(--ok); color: #fff; }
.uv button.on.no { background: var(--bad); color: #fff; }
.stbar div { cursor: pointer; }
.stbar div.off { opacity: .25; }
.famchips { position: absolute; left: 10px; top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
.famchips button { border: 0; background: var(--page); border-radius: 999px; padding: 1px 9px; font: inherit; font-size: 12px; color: var(--ink-2); cursor: pointer; }
.famchips button.on { background: var(--hl); color: #fff; }
/* comparison set: reference, focus and further members, in chain order */
.setbar { display: flex; gap: 4px; align-items: center; min-width: 0; }
.setbar .sc { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border-radius: 999px; padding: 4px 8px 4px 7px; box-shadow: var(--shadow); font-size: 12.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap; cursor: pointer; }
.setbar .sc.ref, .setbar .sc.focus { font-weight: 650; color: var(--ink); font-size: 13.5px; padding: 5px 10px 5px 8px; }
.setbar .sc i { width: 11px; height: 11px; border-radius: 50%; display: block; box-sizing: border-box; border: 2px solid var(--ink-2); }
.setbar .sc.ref i { background: var(--a); border-color: var(--a); } .setbar .sc.focus i { background: var(--b); border-color: var(--b); }
.setbar .sc em { font-style: normal; font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: .03em; }
.setbar .sc b { font-weight: 400; color: var(--muted); cursor: pointer; padding: 0 2px; }
.setbar .sep { color: var(--faint); font-size: 12px; }
.arrow.mem path.shaft { stroke: var(--ink-2); opacity: .7; stroke-width: 1.6; }
.mx .shl { font-size: 10.5px; fill: var(--ink-2); font-weight: 500; }
.mx .shl.focus { fill: var(--ink); font-weight: 650; }
.setbar select { border: 0; background: var(--panel); box-shadow: var(--shadow); border-radius: 999px; padding: 4px 8px; font: inherit; font-size: 12.5px; color: var(--ink-2); cursor: pointer; max-width: 120px; }
.lanelab { font-size: 11px; font-weight: 600; fill: var(--ink-2); }
/* tooltip */
.tip { position: fixed; pointer-events: none; background: var(--panel); border-radius: 12px; padding: 10px 12px; box-shadow: 0 10px 30px rgba(16,24,40,.18);
  display: none; z-index: 9; font-size: 13px; color: var(--ink-2); max-width: 300px; }
.tip b { color: var(--ink); font-weight: 600; }
.tip img { width: 200px; height: 200px; display: block; border-radius: 8px; margin-top: 8px; }
.tip .bar { display: grid; grid-template-columns: 64px 1fr; gap: 4px 8px; margin-top: 6px; align-items: center; }
</style>
</head>
<body>
<header>
  <h1>Default Audit</h1>
  <div class="setbar" id="setBar"></div>
  <button class="iconbtn" id="swap" title="Swap reference and focus">⇄</button>
  <div class="diff" id="diff"></div>
  <div class="seg" id="aspSeg"></div>
  <div class="status" id="status"><span id="mstat" title="Margins changed for exploration; click to restore the pre-registered margins"></span></div>
</header>
<main id="app">
  <section class="card" id="mapCard"><h2><button class="mini" id="zoomReset" title="Reset zoom (or double-click the map)" style="display:none;order:9">⟲</button><span id="mainTitle">Configurations</span><div class="seg mini" id="mainSeg"></div></h2><div class="body" id="map"></div></section>

<script>
"use strict";
const ASP = META.aspects, RET = ASP.filter(a => a.retained), AIDX = Object.fromEntries(ASP.map((a, i) => [a.key, i]));
const SUBJ = META.subjects, G = Object.fromEntries(META.groups.map(g => [g.id, g]));
const PRE_LOC = META.margins.location, PRE_LR = META.margins.log_iqr, NBOOT = 400, DUR = 450;
let M_LOC = PRE_LOC, M_LR = PRE_LR;   // the frozen margins; dragging a band edge changes them for exploration only
const st = { fig: new URLSearchParams(location.search).has("figure"), A: null, B: null, aspect: RET[0].key, subj: 0, hover: null, hoverCfg: null, job: null, jobB: null, ev: "seeds", sortRows: "cat", main: "map",
  seedSel: null, seedSubj: null, subjSel: null, vFilter: null, fam: null };
const cur = () => st.hover ?? st.subj;
// comparison set: up to six configurations in chain order. Two roles: the reference A (every contrast is A -> member)
// and the focus B (the member the per-subject and pairwise views detail). Colour encodes the role only (A blue, B
// orange); every member is identified by position (a matrix column, an image lane, a parallel axis, a small multiple,
// a row of the contrast overview) and by a direct label, so the set is not limited by how many hues stay
// distinguishable (INTERFACE.md, principle 7).
const NSET = 6;
st.set = [];
const SET = () => st.set.filter(g => G[g]);
const colOf = g => g === st.A ? "var(--a)" : g === st.B ? "var(--b)" : st.set.includes(g) ? "var(--ink-2)" : "var(--dot)";
const OTHERS = () => SET().filter(g => g !== st.A);           // members contrasted with the reference, in chain order
function toggleMember(g) {
  if (g === st.A || g === st.B) return;

  else if (st.set.length < NSET) st.set.push(g);

}
function settingsDiff(A, B) {

  return [...new Set([...Object.keys(a), ...Object.keys(b)])].filter(k => String(a[k]) !== String(b[k]) && k !== "pipeline");
}
function setChips() {
  const host = d3.select("#setBar"), S = SET();
  const role = g => g === st.A ? "ref" : g === st.B ? "focus" : "mem";
  host.selectAll("span.sc").data(S, g => g).join(en => {
    const c = en.append("span"); c.append("i"); c.append("em"); c.append("span").attr("class", "nm"); c.append("b").text("×");
    return c;
  }).order().attr("class", g => "sc " + role(g))
    .attr("title", g => `${G[g].label}${g === st.A ? "" : `\nchanges against the reference: ${settingsDiff(st.A, g).join(", ") || "none declared"}`}\n${role(g) === "ref" ? "reference: every contrast is measured from it" : role(g) === "focus" ? "focus: the per-subject views show it against the reference" : "click: make it the focus"} · click the dot: make it the reference`)
    .each(function (g) {

const poleWord = t => t.replace(/^(a |an )/, "").replace(/ (colors|tones|light|background|from far away|with .*|in a .*)$/, "").split(" ").slice(-2).join(" ");

// ---------------- statistics ----------------
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

      const xa = ra.map(r => r[ai]), xb = rb.map(r => r[ai]), sa = mi(xa), sb = mi(xb);
      const rand = rng(1009 * si + 7 * AIDX[a.key] + 1), bd = new Float64Array(NBOOT), bl = new Float64Array(NBOOT);
      const byK = paired ? new Map(rb.map(r => [r[0], r[ai]])) : null;
      for (let b = 0; b < NBOOT; b++) {
        const pa = [], pb = [];
        for (let i = 0; i < xa.length; i++) { const j = Math.floor(rand() * xa.length); pa.push(xa[j]); if (paired) pb.push(byK.get(ra[j][0])); }
        if (!paired) for (let i = 0; i < xb.length; i++) pb.push(xb[Math.floor(rand() * xb.length)]);
        const ba = mi(pa), bb = mi(pb); bd[b] = (bb.med - ba.med) / sc; bl[b] = Math.log(bb.iqr / ba.iqr);
      }

    });

}

// ---------------- main view: configuration map ----------------
const FAMS = { "Stable Diffusion": d3.symbolCircle, "FLUX.2": d3.symbolSquare, "Qwen-Image": d3.symbolTriangle };   // family = shape; hue is reserved for A and B

const SHORT = { G01: "SD1.5", G02: "SDXL", G03: "Turbo", G04: "SD3.5", G05: "dev", G06: "kb4·4", G07: "kb4·1", G08: "k4",
  G09: "Qw·4", G10: "Qw·1", G11: "kb9", G12: "k9" };
const ORDER = ["G01", "G02", "G03", "G04", "G05", "G11", "G12", "G06", "G07", "G08", "G09", "G10"];

const famShape = g => FAMS[g.family] || d3.symbolCircle;
let OV = null;
const OVS = { zt: d3.zoomIdentity };
const cfgDrag = d3.drag().clickDistance(5).subject(e => ({ x: e.x, y: e.y }))

  .on("drag", (e, d) => OVS.tmp.attr("d", `M${OVS.x(d.x)},${OVS.y(d.y)} L${e.x},${e.y}`))
  .on("end", (e, d) => {

// typical location and spread of each configuration on one aspect: per subject, location is the distance of the

function buildMap() {

// a new pair or aspect starts from the fitted view (the old zoom would refer to other axes)
function clearZoom() { OVS.zt = d3.zoomIdentity; OVS.svg?.property("__zoom", d3.zoomIdentity); }
function resetZoom() {

function drawMap(animate, zoomOnly) {

  if (st.main === "trail") { drawTrail(); drawMatrix(); overviewHL(); return; }
  const a = ASP[AIDX[st.aspect]], { x, y, m, W, H } = OVS, t = d3.transition().duration(animate ? DUR : 0).ease(d3.easeCubicInOut);

  if (zoomOnly) t.duration(0);

    .attr("marker-end", c => Math.abs(c.p.d * len) > 8 ? "url(#coah)" : null);
  g.append("circle").attr("r", 2.5).attr("fill", "var(--ink)");
  g.filter(c => c.rev >= 3).append("text").attr("x", cw / 2 - 14).attr("y", -ch / 2 + 16).attr("text-anchor", "end")

function coHL() {

  OVS.coCol.attr("stroke", a => a.key === st.aspect ? "var(--hl)" : "none").attr("stroke-width", 2);
}

// ---------------- auxiliary, third mode: appearance map of one subject ----------------
// All images of the subject from every configuration, placed by a shared t-SNE of their CLIP image embeddings
// (computed at build time). Grey dots are the other configurations; A and B are coloured dots. It is an index to images
// that can show a default the five aspects do not name. t-SNE keeps only local neighbourhoods, so no contours are drawn:
// areas and distances on it must not be read as spread (external review 2026-10-22).
function drawClusters(host, si) {
  if (typeof TSNE === "undefined") return;

  const { w: W, h: H } = box("#ridge"), m = 18, svg = host.append("svg").attr("width", W).attr("height", H);
  const side = Math.min(W - 2 * m, H - 2 * m), ox = (W - side) / 2, oy = (H - side) / 2;
  const x = v => ox + v * side, y = v => oy + (1 - v) * side;
  const pts = META.groups.flatMap(g => (TSNE[g.id]?.[si] || []).map((p, i) => ({ g: g.id, p, r: SCORES[g.id][si][i] })));
  const other = pts.filter(d => !SET().includes(d.g));
  svg.append("g").selectAll("circle").data(other).join("circle").attr("class", "cpt").attr("cx", d => x(d.p[0])).attr("cy", d => y(d.p[1]))
    .attr("r", 2.6).attr("fill", d => famColor(G[d.g])).attr("opacity", .28)
    .on("mousemove", (e, d) => showTip(e, imgTip(d.g, d.r))).on("mouseleave", hideTip);
  svg.append("g").selectAll("circle").data(pts.filter(d => SET().includes(d.g))).join("circle")
    .attr("class", "cpt ab").attr("data-j", d => d.r[2]).attr("data-g", d => d.g)
    .attr("cx", d => x(d.p[0])).attr("cy", d => y(d.p[1])).attr("r", 3.6).attr("fill", d => colOf(d.g))
    .attr("stroke", "var(--panel)").attr("stroke-width", 1).style("cursor", "pointer")
    .on("mouseenter", (e, d) => { st.job = d.r[2]; st.jobB = null; markJob(); })
    .on("mousemove", (e, d) => showTip(e, imgTip(d.g, d.r))).on("mouseleave", hideTip);
  markJob(); seedHL();
}

// More than two configurations: small multiples on the same layout, one per member in chain order; each shows that
// member's images over all images of the subject (grey), so where a member's images fall is read by panel, not by hue.
// Hovering an image marks the same seed in every panel.
function drawClusterSM(host, si) {
  const members = SET(), n = members.length, { w: W, h: H } = box("#ridge"), cols = n <= 3 ? n : Math.ceil(n / 2), rws = Math.ceil(n / cols);
  const gap = 8, cw = (W - gap * (cols + 1)) / cols, chh = (H - gap * (rws + 1)) / rws, side = Math.max(40, Math.min(cw - 8, chh - 22));
  const svg = host.append("svg").attr("width", W).attr("height", H);
  const all = META.groups.flatMap(g => (TSNE[g.id]?.[si] || []).map((p, i) => ({ g: g.id, p, r: SCORES[g.id][si][i] })));
  members.forEach((gid, k) => {
    const x0 = gap + (k % cols) * (cw + gap), y0 = gap + Math.floor(k / cols) * (chh + gap), ox = x0 + (cw - side) / 2, oy = y0 + 18;
    const x = v => ox + v * side, y = v => oy + (1 - v) * side, g = svg.append("g");
    g.append("rect").attr("x", x0).attr("y", y0).attr("width", cw).attr("height", chh).attr("rx", 8).attr("fill", "none").attr("stroke", gid === st.B ? "var(--b)" : "var(--grid)");
    g.append("circle").attr("cx", x0 + 11).attr("cy", y0 + 10).attr("r", 4.5).attr("fill", colOf(gid));
    g.append("text").attr("class", "lanelab").attr("x", x0 + 20).attr("y", y0 + 10).attr("dy", "0.35em").text(sh(G[gid])).append("title").text(G[gid].label);
    g.append("g").selectAll("circle").data(all.filter(d => d.g !== gid)).join("circle").attr("cx", d => x(d.p[0])).attr("cy", d => y(d.p[1]))
      .attr("r", 1.5).attr("fill", "var(--dot)").attr("opacity", .4);
    g.append("g").selectAll("circle").data(all.filter(d => d.g === gid)).join("circle").attr("class", "cpt ab").attr("data-j", d => d.r[2])
      .attr("cx", d => x(d.p[0])).attr("cy", d => y(d.p[1])).attr("r", 3).attr("fill", colOf(gid)).attr("stroke", "var(--panel)").attr("stroke-width", .8).style("cursor", "pointer")
      .on("mouseenter", (e, d) => { st.job = d.r[2]; st.jobB = null; markJob(); })
      .on("mousemove", (e, d) => showTip(e, imgTip(d.g, d.r))).on("mouseleave", hideTip);
  });
  markJob(); seedHL();
}

// ---------------- auxiliary, fourth mode: rewrite view (LLM prompt rewriting) ----------------
// For a pair whose one side uses rewritten prompts: each rewritten image is a dot at x = what its rewrite says about the
// aspect (CLIP text score of the rewrite minus that of the original prompt, in text units) and y = where the image lands
// (scale units from the original prompt's median). The original prompt's images form the tick column at x = 0.
// A rewrite that says "vivid" next to an image that is muted lies right and low.
const FAMILIES = { lighting: ["light", "lit", "glow", "sunlight", "shadow"], "time of day": ["morning", "afternoon", "evening", "sunset", "golden hour", "dusk", "dawn", "night"],
  cinematic: ["cinematic", "photograph", "photorealistic", "realistic", "lens", "depth of field", "bokeh", "mm"],
  colour: ["warm", "vibrant", "muted", "saturated", "pastel", "color", "colour"], background: ["background", "surrounded", "scene", "environment"],
  style: ["painting", "illustration", "watercolor", "render", "style"] };

const esc = t => t.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
function drawRewrites(host, si) {
  const { w: W, h: H } = box("#ridge"), svg = host.append("svg").attr("width", W).attr("height", H);
  const gid = rwGroup(), rw = SET().find(g => G[g].rewrite);
  if (!gid || typeof REWRITE === "undefined" || !REWRITE[gid]) {
    svg.append("text").attr("x", 14).attr("y", 26).text(rw ? `A rewrite is read against its own base: ${G[G[rw].base].label} → ${G[rw].label}.` : "Pick a dotted arrow (prompt rewritten by an LLM) to compare text and image.");
    if (rw) svg.append("text").attr("x", 14).attr("y", 46).style("fill", "var(--ink)").style("cursor", "pointer").style("font-weight", 600).text("show this pair →").on("click", () => setPair(G[rw].base, rw));
    return;
  }
  const other = gid === st.B ? st.A : st.B, a = ASP[AIDX[st.aspect]], ai = 3 + AIDX[a.key], sc = META.scale[a.key];
  const img = new Map(SCORES[gid][si].map(r => [r[0], r])), ma = mi(SCORES[other][si].map(r => r[ai])).med;
  const pts = REWRITE[gid][si].map(([k, txt, ts]) => ({ k, txt, tx: ts[AIDX[a.key]], r: img.get(k) })).filter(d => d.r)
    .map(d => ({ ...d, iy: (d.r[ai] - ma) / sc }));
  const base = SCORES[other][si].map(r => ({ r, iy: (r[ai] - ma) / sc }));
  const m = { l: 40, r: 16, t: 34, b: 34 };

  const chips = host.append("div").attr("class", "famchips");

    .text(f => `${f} ${pts.filter(d => famHas(d.txt, f)).length}`).classed("on", f => f === st.fam)
    .attr("title", "Highlight rewrites that mention this word family").on("click", (e, f) => { st.fam = st.fam === f ? null : f; drawRidge(); });
  m.t = chips.node().offsetHeight + 14;
  const xe = Math.max(1, d3.max(pts, d => Math.abs(d.tx)) * 1.1), ye = Math.max(1.5, d3.max([...pts, ...base], d => Math.abs(d.iy)) * 1.1);
  const x = d3.scaleLinear([-xe, xe], [m.l, W - m.r]), y = d3.scaleLinear([-ye, ye], [H - m.b, m.t]);
  svg.append("rect").attr("class", "band").attr("x", m.l).attr("width", W - m.l - m.r).attr("y", y(M_LOC)).attr("height", y(-M_LOC) - y(M_LOC)).attr("rx", 4);
  svg.append("line").attr("class", "zero").attr("x1", x(0)).attr("x2", x(0)).attr("y1", m.t).attr("y2", H - m.b);
  svg.append("line").attr("class", "zero").attr("x1", m.l).attr("x2", W - m.r).attr("y1", y(0)).attr("y2", y(0));
  const oc = gid === st.B ? "var(--a)" : "var(--b)", rc = gid === st.B ? "var(--b)" : "var(--a)";
  svg.append("g").selectAll("line").data(base).join("line").attr("class", "rug").attr("stroke", oc).attr("data-j", d => d.r[2])
    .attr("x1", x(0) - 5).attr("x2", x(0) + 5).attr("y1", d => y(d.iy)).attr("y2", d => y(d.iy))
    .on("mouseenter", (e, d) => { st.job = d.r[2]; markJob(); }).on("mousemove", (e, d) => showTip(e, imgTip(other, d.r))).on("mouseleave", hideTip);

    if (!e.sourceEvent) return;

    else { const [[x0, y0], [x1, y1]] = e.selection; st.seedSel = new Set(pts.filter(d => x(d.tx) >= x0 && x(d.tx) <= x1 && y(d.iy) >= y0 && y(d.iy) <= y1).map(d => d.r[2])); }
    st.seedSubj = si; seedHL();
  }));
  svg.append("g").selectAll("circle").data(pts).join("circle").attr("class", "cpt ab").attr("data-j", d => d.r[2])
    .attr("cx", d => x(d.tx)).attr("cy", d => y(d.iy)).attr("r", d => st.fam && famHas(d.txt, st.fam) ? 5.5 : 4).attr("fill", rc)
    .attr("opacity", d => st.fam && !famHas(d.txt, st.fam) ? .2 : 1).attr("stroke", d => st.fam && famHas(d.txt, st.fam) ? "var(--ink)" : "var(--panel)").style("cursor", "pointer")
    .on("mouseenter", (e, d) => { st.job = d.r[2]; st.jobB = null; markJob(); })
    .on("mousemove", (e, d) => showTip(e, `<b>${G[gid].label}</b> · seed ${d.r[1]}<div style="margin-top:6px;max-height:150px;overflow:hidden">${esc(d.txt).replace(FAMRE, "<mark>$&</mark>")}</div><img src="thumbs/${gid}/${d.r[2]}.jpg" alt="">`))
    .on("mouseleave", hideTip);
  svg.append("text").attr("class", "pole").attr("x", m.l).attr("y", H - 8).text("text: " + poleWord(a.left));
  svg.append("text").attr("class", "pole").attr("x", W - m.r).attr("y", H - 8).attr("text-anchor", "end").text(poleWord(a.right));
  svg.append("text").attr("class", "pole").attr("x", 6).attr("y", m.t + 8).text("image");
  svg.append("text").attr("class", "pole").attr("x", W - m.r).attr("y", m.t + 8).attr("text-anchor", "end").text(aspName(a.key));
  markJob(); seedHL();
}

// ---------------- main view, third mode: VLM statements checked against the audit ----------------
// Each free-text statement a VLM made about the selected pair, coded to an aspect and direction, with the audit's
// verdict for the same contrast, level and subject. The bar summarises the verdicts; clicking a statement selects its
// aspect and subject so the other views show the evidence.
const VCOL = v => v.startsWith("confirmed") ? "var(--ok)" : v === "contradicted" ? "var(--bad)" : v.startsWith("narrowed") ? "var(--warn)"
  : v === "audit: no shift" ? "var(--muted)" : "var(--faint)";
const VORDER = ["confirmed", "narrowed, did not move", "audit: no shift", "contradicted", "other"];
const vkey = v => v.startsWith("confirmed") ? "confirmed" : VORDER.includes(v) ? v : "other";
st.vlm = "all"; st.stLevel = "subject";
// rows = pooled + subjects, columns = the five aspects, variety, other; one small glyph per statement (circle = Qwen-4B,
// square = Mistral-24B) coloured by the audit's verdict. The bar above summarises the verdicts and filters them. Text
// appears only on hover and for the selected statement at the bottom, where the analyst can record ✓ / ✗.
const SCOLS = ["sat", "medium", "shot", "tone", "bg", "variety", "other"];
function drawStatements() {
  const host = d3.select("#map"); host.selectAll("*").remove();
  const all = (typeof STATEMENTS === "undefined" ? [] : STATEMENTS).filter(s => s.A === st.A && s.B === st.B);
  if (!all.length) {
    const wrap = host.append("div").attr("id", "stmts");
    wrap.append("div").attr("class", "m").style("color", "var(--muted)").style("margin", "8px 0").text("No VLM description of this pair.");
    const pairs = d3.groups(STATEMENTS || [], s => s.A + ">" + s.B).map(([, ss]) => ss[0]);
    wrap.selectAll("button.chipbtn").data(pairs).join("button").attr("class", "chipbtn").text(s => `${sh(G[s.A])} → ${sh(G[s.B])}`).on("click", (e, s) => setPair(s.A, s.B));
    return;
  }
  const { w: W, h: H } = box("#map");
  const ctl = host.append("div").attr("class", "stctl").style("position", "absolute").style("left", "12px").style("top", "2px");
  ctl.append("div").attr("class", "seg mini").selectAll("button").data([["all", "●■"], ["qwen", "● Qwen-4B"], ["mistral", "■ Mistral-24B"]]).join("button")
    .text(d => d[1]).classed("on", d => d[0] === st.vlm).on("click", (e, d) => { st.vlm = d[0]; drawStatements(); });
  ctl.append("button").attr("class", "mini").attr("title", "Download your own verdicts (✓ / ✗) as CSV").text("⤓").on("click", exportVerdicts);
  const list0 = all.filter(s => st.vlm === "all" || s.vlm === st.vlm);
  const list = list0.filter(s => !st.vFilter || vkey(s.verdict) === st.vFilter);
  const svg = host.append("svg").attr("width", W).attr("height", H);
  const m = { l: 128, r: 14, t: 60, b: st.stSel ? 46 : 14 }, bw = W - m.l - m.r;
  // verdict bar (filter)
  const counts = d3.rollup(list0, v => v.length, s => vkey(s.verdict)), keys = VORDER.filter(k => counts.get(k));
  const bx = d3.scaleLinear([0, list0.length], [m.l, m.l + bw]); let acc = 0;
  svg.append("g").selectAll("rect").data(keys.map(k => { const r = { k, x0: acc, n: counts.get(k) }; acc += r.n; return r; })).join("rect")
    .attr("x", d => bx(d.x0) + 1).attr("width", d => Math.max(1, bx(d.x0 + d.n) - bx(d.x0) - 2)).attr("y", 33).attr("height", 6).attr("rx", 2)
    .attr("fill", d => VCOL(d.k === "other" ? "" : d.k)).attr("opacity", d => st.vFilter && st.vFilter !== d.k ? .25 : 1).style("cursor", "pointer")
    .on("mousemove", (e, d) => showTip(e, `<b>${d.k}</b> · ${d.n} of ${list0.length}`)).on("mouseleave", hideTip)
    .on("click", (e, d) => { st.vFilter = st.vFilter === d.k ? null : d.k; drawStatements(); });
  const VSYM = { confirmed: "✓", "narrowed, did not move": "≈", "audit: no shift": "○", contradicted: "✗", other: "?" };
  svg.append("g").selectAll("text").data(keys.map(k => { let x0 = 0; for (const k2 of keys) { if (k2 === k) break; x0 += counts.get(k2); } return { k, x0, n: counts.get(k) }; }))
    .join("text").attr("x", d => bx(d.x0) + 2).attr("y", 28).style("font-size", "11px").style("fill", "var(--ink-2)")
    .text(d => bx(d.x0 + d.n) - bx(d.x0) > 34 ? `${VSYM[d.k]} ${d.n}` : VSYM[d.k]);
  // glyph matrix
  const rows = [{ key: -1, name: "pooled" }, ...SUBJ.map((s, i) => ({ key: i, name: s.name.replace(/^an? /, "") }))];
  const rh = Math.max(8, (H - m.t - m.b) / rows.length), cw = bw / SCOLS.length, gsz = Math.max(4, Math.min(8, rh - 4));
  const ry = d3.scaleBand(rows.map(r => r.key), [m.t, H - m.b]).paddingInner(.08);
  svg.append("g").selectAll("text").data(SCOLS).join("text").attr("x", (c, i) => m.l + (i + .5) * cw).attr("y", m.t - 4).attr("text-anchor", "middle")
    .style("font-size", "11px").style("fill", "var(--ink-2)").style("font-weight", 500).text(c => SCOLS.indexOf(c) < 5 ? aspName(c) : c);
  svg.append("g").selectAll("rect").data(rows).join("rect").attr("class", "strow").attr("x", 6).attr("width", W - 12).attr("y", r => ry(r.key)).attr("height", ry.bandwidth()).attr("rx", 3)
    .attr("fill", r => r.key === st.subj ? "var(--band)" : "none");
  svg.append("g").selectAll("text").data(rows).join("text").attr("x", m.l - 8).attr("y", r => ry(r.key) + ry.bandwidth() / 2).attr("dy", "0.35em").attr("text-anchor", "end")
    .style("font-size", Math.min(11, rh - 1) + "px").style("fill", r => r.key === st.subj ? "var(--ink)" : "var(--ink-2)").style("font-weight", r => r.key < 0 ? 600 : 400)
    .text(r => r.name).style("cursor", "pointer").on("click", (e, r) => { if (r.key >= 0) pick(r.key, st.aspect); });
  svg.append("g").selectAll("line").data(d3.range(SCOLS.length + 1)).join("line").attr("x1", i => m.l + i * cw).attr("x2", i => m.l + i * cw)
    .attr("y1", m.t).attr("y2", H - m.b).attr("stroke", "var(--grid)");
  const cell = d3.group(list, s => (s.level === "pooled" ? -1 : s.si) + "|" + (SCOLS.slice(0, 5).includes(s.prop) ? s.prop : s.prop === "variety" ? "variety" : "other"));
  const glyphs = [];
  for (const [k, ss] of cell) {
    const [rk, col] = k.split("|"), ci = SCOLS.indexOf(col), step = Math.min(gsz + 2, (cw - 8) / Math.max(1, ss.length));
    ss.forEach((s, j) => glyphs.push({ s, x: m.l + ci * cw + 4 + gsz / 2 + j * step, y: ry(+rk) + ry.bandwidth() / 2 }));
  }
  const U = userV();
  svg.append("g").selectAll("path").data(glyphs).join("path").attr("class", "sg")
    .attr("d", d => d3.symbol(d.s.vlm === "qwen" ? d3.symbolCircle : d3.symbolSquare, gsz * gsz * (d.s.vlm === "qwen" ? .85 : .7))())
    .attr("transform", d => `translate(${d.x},${d.y})`).attr("fill", d => d.s.verdict === "contradicted" ? "var(--panel)" : VCOL(d.s.verdict))
    .attr("stroke", d => d.s === st.stSel ? "var(--ink)" : d.s.verdict === "contradicted" ? "var(--bad)" : U[vid(d.s)] ? "var(--ink-2)" : "var(--panel)")
    .attr("stroke-width", d => d.s === st.stSel ? 2 : d.s.verdict === "contradicted" ? 1.8 : 1)
    .style("cursor", "pointer")
    .on("mousemove", (e, d) => showTip(e, `<b style="color:${VCOL(d.s.verdict)}">${d.s.verdict}</b><br>${esc(d.s.text)}<br><span style="color:var(--muted)">${d.s.vlm === "qwen" ? "Qwen3.5-4B" : "Mistral-24B"}</span>`))
    .on("mouseleave", hideTip)
    .on("click", (e, d) => { st.stSel = d.s; pick(d.s.si >= 0 ? d.s.si : st.subj, d.s.aspect || st.aspect); drawStatements(); });
  // the selected statement, with the analyst's verdict
  if (st.stSel && all.includes(st.stSel)) {
    const d = host.append("div").attr("class", "stmt on").style("position", "absolute").style("left", "10px").style("right", "10px").style("bottom", "6px").style("background", "var(--panel)");
    d.append("i").style("background", VCOL(st.stSel.verdict));
    d.append("div").attr("class", "t").style("font-size", "12px").text(st.stSel.text);
    d.append("div").attr("class", "uv").selectAll("button").data([["ok", "✓"], ["no", "✗"]]).join("button").attr("class", b => b[0])
      .classed("on", b => U[vid(st.stSel)] === b[0]).text(b => b[1])
      .on("click", (e, b) => { const V = userV(), k = vid(st.stSel); V[k] = V[k] === b[0] ? undefined : b[0]; saveV(V); drawStatements(); });
    d.select(".uv").append("button").attr("title", "Follow this statement in the audit trail: measurement, subject, images").text("⛓")
      .on("click", () => { st.main = "trail"; st.trailK = 0; panelControls(); buildMap(); drawMap(false); });
  }
}
// ---------------- main view, fourth mode: audit trail ----------------
// One claim stated in language, followed to the evidence that decides it, in four fixed stages: the claim (a VLM
// statement, a rewritten prompt, or the name of a language-defined axis), the measurement (validity of the axis for the
// pair, the per-subject contrast scatter and its pooled estimate), one subject (A and B on the axis), and the images
// (A and B from the same seed, or matched by rank). Each link carries the audit's verdict; the last link is the
// analyst's own, given after looking at the images. The trail follows the current selection; saved trails restore
// their view and are exported for the paper's end-to-end cases.

  const ra = SCORES[st.A][si], rb = SCORES[st.B][si], ma = mi(ra.map(r => r[ai])).med, v = r => (r[ai] - ma) / sc;
  const vals = [...ra, ...rb].map(v), lo = Math.min(-M_LOC, d3.min(vals)), hi = Math.max(M_LOC, d3.max(vals)), pad = (hi - lo) * .04;
  const m = { l: 14, r: 14, t: 4, b: 20 }, mid = (H - m.b + m.t) / 2, track = 9, gap = track + 4;
  const x = d3.scaleLinear([lo - pad, hi + pad], [m.l + 24, W - m.r - 24]);
  // three rows per side and thumbnails as large as the rows allow; where images crowd, they overlap (a pile reads as
  // density) and hovering brings one to the front
  const ROWS = 3, sz = Math.max(22, Math.min(64, (mid - m.t - gap) / ROWS - 2));
  const place = rows => { const last = d3.range(ROWS).map(() => -1e9); return [...rows].sort((p, q2) => v(p) - v(q2)).map(r => {
    const cx = x(v(r)), free = last.findIndex(l => cx - l >= sz + 2);
    const row = free >= 0 ? free : d3.maxIndex(last.map(l => cx - l)); last[row] = cx; return { r, cx, row }; }); };
  const PA = place(ra), PB = place(rb);
  const svg = host.append("svg").attr("width", W).attr("height", H).attr("class", "imgax");
  svg.append("rect").attr("class", "band").attr("x", x(-M_LOC)).attr("width", x(M_LOC) - x(-M_LOC)).attr("y", m.t).attr("height", H - m.b - m.t).attr("rx", 4);
  svg.append("line").attr("class", "zero").attr("x1", m.l).attr("x2", W - m.r).attr("y1", mid).attr("y2", mid);
  const items = [...PA.map(d => ({ ...d, g: st.A, side: -1 })), ...PB.map(d => ({ ...d, g: st.B, side: 1 }))];
  items.forEach(d => { d.y = d.side < 0 ? mid - gap - (d.row + 1) * (sz + 2) : mid + gap + d.row * (sz + 2); d.x0 = d.cx - sz / 2; });
  Object.assign(AX, { items, sz });
  [[-1, mid - gap + 1, "var(--a)"], [1, mid + 3, "var(--b)"]].forEach(([side, y0, c]) => {
    svg.append("rect").attr("class", "axtrack").attr("x", x.range()[0]).attr("width", x.range()[1] - x.range()[0]).attr("y", y0).attr("height", track).attr("rx", 4);
    const md = x(d3.median(side < 0 ? ra : rb, v));
    svg.append("path").attr("d", d3.symbol(d3.symbolTriangle, 46)()).attr("transform", `translate(${md},${y0 + track / 2}) rotate(${side < 0 ? 180 : 0})`).attr("fill", c);
    svg.append("circle").attr("cx", m.l + 6).attr("cy", y0 + track / 2).attr("r", 5).attr("fill", c);
    const br = d3.brushX().extent([[x.range()[0], y0], [x.range()[1], y0 + track]]).on("end", e => {
      if (!e.sourceEvent) return;
      if (!e.selection) st.seedSel = null;
      else { const [p, q2] = e.selection; st.seedSel = new Set(items.filter(d => d.side === side && d.cx >= p && d.cx <= q2).map(d => d.r[2])); }
      st.seedSubj = si; seedHL();
    });
    svg.append("g").attr("class", "axbrush").call(br);
  });
  const g = svg.append("g").selectAll("g.axi").data(items, d => d.g + d.r[2]).join("g").attr("class", "axi")
    .attr("transform", d => `translate(${d.x0},${d.y})`)
    .on("mouseenter", function (e, d) { d3.select(this).raise(); st.job = d.r[2]; st.jobB = null; markJob(); })
    .on("mousemove", (e, d) => showTip(e, imgTip(d.g, d.r))).on("mouseleave", hideTip)
    .on("click", (e, d) => { st.seedSel = new Set([d.r[2]]); st.seedSubj = si; seedHL(); });
  g.append("image").attr("href", d => `thumbs/${d.g}/${d.r[2]}.jpg`).attr("width", sz).attr("height", sz).attr("preserveAspectRatio", "xMidYMid slice");
  g.append("rect").attr("class", "axb").attr("width", sz).attr("height", sz).attr("rx", 3).attr("stroke", d => d.side < 0 ? "var(--a)" : "var(--b)");
  svg.append("text").attr("class", "pole").attr("x", m.l).attr("y", H - 5).text(poleWord(a.left));
  svg.append("text").attr("class", "pole").attr("x", W - m.r).attr("y", H - 5).attr("text-anchor", "end").text(poleWord(a.right));
  markJob(); seedHL();
}
function seedHL() {
  const S = st.seedSubj === cur() ? st.seedSel : null, has = j => !!S && S.has(j);
  d3.selectAll("g.axi").classed("sel", d => has(d.r[2])).classed("dim", d => !!S && !has(d.r[2]));
  d3.selectAll(".traj").classed("sel", function () { return has(this.dataset.j); }).classed("dim", function () { return !!S && !has(this.dataset.j); })
    .filter(function () { return has(this.dataset.j); }).raise();
  d3.selectAll(".cpt.ab").classed("sel", function () { return has(this.dataset.j); }).classed("dim", function () { return !!S && !has(this.dataset.j); });
  d3.selectAll(".rug").classed("sel", function () { return has(this.dataset.j); });
  d3.select("#selCount").style("display", S ? null : "none").text(S ? `${S.size} seeds` : "");
  d3.select("#selClear").style("display", S ? null : "none");
}
function markJob() {
  d3.selectAll("g.axi").classed("hl", d => d.r[2] === st.job || (d.g === st.B && d.r[2] === st.jobB));
  d3.selectAll(".traj").classed("hl", function () { return this.dataset.j === st.job; }).filter(function () { return this.dataset.j === st.job; }).raise();
  d3.selectAll(".cpt.ab").classed("hl", function () { return this.dataset.j === st.job; }).filter(function () { return this.dataset.j === st.job; }).raise();
  d3.selectAll(".rug").classed("hl", function () { return this.dataset.j === st.job && this.parentNode.style.opacity === "1"; })
    .filter(function () { return this.dataset.j === st.job; }).raise();
}
function imgTip(g, r) { return `<b>${G[g].label}</b> · seed ${r[1]}<img src="thumbs/${g}/${r[2]}.jpg" alt="">`; }

// ---------------- tooltip ----------------
function showTip(e, html) {
  const t = d3.select("#tip").html(html).style("display", "block"), n = t.node();
  t.style("left", Math.min(e.clientX + 16, innerWidth - n.offsetWidth - 10) + "px")
   .style("top", Math.min(e.clientY + 16, innerHeight - n.offsetHeight - 10) + "px");
}
function hideTip() { d3.select("#tip").style("display", "none"); }

// ---------------- init and responsive layout ----------------
let R = null;
function update() { setChips(); panelControls(); clearZoom(); diffChips(); R = contrast(); drawScatters(true); drawMap(true); aspectSeg(); }
function layout() { buildMap(); buildScatters(); drawScatters(false); drawMap(false); }
d3.select("body").classed("fig", st.fig);
header(); aspectSeg(); panelControls(); buildMap(); buildScatters(); update();
d3.select("#zoomReset").on("click", resetZoom);
[["#mapCard h2", "A"], ["#matrixCard h2", "B"], ["#ridgeCard h2", "D"], ["#stripCard", "C"]].forEach(([sel, l]) => {
  const h = sel === "#stripCard" ? d3.select("#stripName") : d3.select(sel);
  if (sel !== "#stripCard") { const sp = document.createElement("span"); sp.className = "pl"; sp.textContent = l; h.node().prepend(sp); }
});
let rt = null;
new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(layout, 120); }).observe(document.getElementById("app"));
</script>
