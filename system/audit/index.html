<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Default Audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --page: #f5f6f8; --panel: #ffffff; --ink: #1f2328; --ink-2: #4b5260; --muted: #8a909a; --faint: #c9cdd4;
  --grid: #eef0f3; --band: rgba(31,35,40,.045); --dot: #b4b9c2;
  --a: #4c78a8; --b: #f58518; --hl: #7b61ff; --warn: #c27c0e; --shadow: 0 1px 2px rgba(16,24,40,.04), 0 6px 20px rgba(16,24,40,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0f1115; --panel: #181b21; --ink: #eceef2; --ink-2: #b7bcc6; --muted: #7f8692; --faint: #3a3f48;
    --grid: #23272e; --band: rgba(255,255,255,.05); --dot: #5c626d; --a: #6f9ccf; --b: #f7a24b; --hl: #9d8bff; --warn: #e3a33a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0f1115; --panel: #181b21; --ink: #eceef2; --ink-2: #b7bcc6; --muted: #7f8692; --faint: #3a3f48;
  --grid: #23272e; --band: rgba(255,255,255,.05); --dot: #5c626d; --a: #6f9ccf; --b: #f7a24b; --hl: #9d8bff; --warn: #e3a33a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-feature-settings: "tnum"; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; padding: 12px 16px 14px;
  min-width: 1280px; min-height: 760px; height: 100vh; overflow: hidden; }
/* header */
header { display: flex; align-items: center; gap: 10px; min-width: 0; }
header h1 { font-size: 18px; font-weight: 650; margin: 0 8px 0 0; letter-spacing: -.01em; white-space: nowrap; }
.pill { display: flex; align-items: center; gap: 8px; background: var(--panel); border-radius: 999px; padding: 5px 8px 5px 12px; box-shadow: var(--shadow); }
.pill i { width: 10px; height: 10px; border-radius: 50%; display: block; flex: none; }
.pill select { border: 0; background: transparent; font: inherit; font-weight: 600; color: var(--ink); outline: none; cursor: pointer; }
.iconbtn { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--panel); box-shadow: var(--shadow); color: var(--ink-2); font-size: 15px; cursor: pointer; flex: none; }
.diff { display: flex; gap: 6px; min-width: 0; overflow: hidden; }
.diff span { font-size: 13px; color: var(--ink-2); background: var(--panel); border-radius: 999px; padding: 3px 10px; box-shadow: var(--shadow); white-space: nowrap; }
.diff span.warn { color: var(--warn); font-weight: 600; }
.seg { display: flex; gap: 2px; background: var(--panel); border-radius: 999px; padding: 3px; box-shadow: var(--shadow); margin-left: auto; flex: none; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.seg button.on { background: var(--ink); color: var(--panel); font-weight: 600; }
.status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; flex: none; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); display: inline-block; }
/* layout: main view (configuration map) + auxiliary views */
#app { display: grid; gap: 10px; min-height: 0;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) clamp(230px, 18vw, 320px);
  grid-template-rows: minmax(0, 1.6fr) minmax(0, 1fr);
  grid-template-areas: "map matrix side" "strip ridge side"; }
.card { background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); min-width: 0; min-height: 0; display: flex; flex-direction: column; transition: box-shadow .2s; }
.card h2 { font-size: 14px; font-weight: 600; margin: 0; padding: 10px 14px 0; display: flex; align-items: center; gap: 8px; flex: none; color: var(--ink); }
.card h2 small { color: var(--muted); font-weight: 400; font-size: 12px; }
.card h2 select { margin-left: auto; font: inherit; font-size: 13px; font-weight: 500; border: 0; background: var(--page); border-radius: 999px; padding: 3px 10px; color: var(--ink); cursor: pointer; max-width: 55%; }
.card .body { flex: 1; min-height: 0; position: relative; }
#mapCard { grid-area: map; } #matrixCard { grid-area: matrix; } #stripCard { grid-area: strip; } #ridgeCard { grid-area: ridge; }
#side { grid-area: side; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
#side .card { flex: 1; cursor: pointer; }
#side .card.on { box-shadow: 0 0 0 2px var(--hl), var(--shadow); }
#side .card h2 { padding-top: 7px; font-size: 13px; }
svg { display: block; }
svg text { fill: var(--muted); font-size: 12px; font-family: inherit; }
.band { fill: var(--band); }
.zero { stroke: var(--faint); stroke-width: 1; }
.pole { font-size: 12px; fill: var(--muted); }
/* map */
.cfg circle.pt { stroke: var(--panel); stroke-width: 2; cursor: pointer; }
.cfg .ring { fill: none; stroke-width: 2.5; }
.lab text { font-size: 13px; fill: var(--ink-2); font-weight: 500; paint-order: stroke; stroke: var(--panel); stroke-width: 3px; pointer-events: none; }
.arrow path.shaft { fill: none; stroke: var(--ink-2); stroke-width: 1.8; stroke-linecap: round; opacity: .7; }
.arrow path.hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
.arrow.package path.shaft { stroke-dasharray: 5 4; }
.arrow:hover path.shaft { stroke: var(--hl); opacity: 1; stroke-width: 2.4; }
.detail path.link { fill: none; stroke-width: 1.2; opacity: .55; }
.detail path.mk { stroke: var(--panel); stroke-width: 1; }
/* matrix */
.mx rect.cell { cursor: pointer; }
.mx rect.cell:hover, .mx rect.cell.on { stroke: var(--ink); stroke-width: 1.5; }
.mx .rl { fill: var(--ink-2); cursor: pointer; }
.mx .rl.on { fill: var(--hl); font-weight: 600; }
.mx .cl { font-size: 11px; fill: var(--ink-2); font-weight: 500; }
/* contrast scatters */
.subj { fill: var(--dot); stroke: var(--panel); stroke-width: 1.2; cursor: pointer; }
.subj.on { fill: var(--hl); }
.ci { stroke: var(--hl); stroke-width: 2; stroke-linecap: round; opacity: 0; }
.ci.on { opacity: .55; }
.pool path { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.pool line { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; opacity: .8; }
/* ridge */
.ridge .area { stroke-width: 2; stroke-linejoin: round; }
.ridge .rowlab { fill: var(--ink-2); font-size: 13px; font-weight: 600; }
.ridge .row { cursor: pointer; }
.rug { stroke-width: 2.2; stroke-linecap: round; cursor: pointer; }
.rug.hl { stroke: var(--hl) !important; stroke-width: 3.5; }
/* strip */
#strip { padding: 2px 14px 10px; overflow: auto; }
.lane { display: grid; gap: 4px; margin: 4px 0 6px; }
.lane img { width: 100%; aspect-ratio: 1; display: block; border-radius: 6px; cursor: pointer; transition: transform .15s, box-shadow .15s; }
.lane img:hover { transform: scale(1.05); }
.lane img.hl { box-shadow: 0 0 0 3px var(--hl); }
.lanehead { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-weight: 600; font-size: 13px; color: var(--ink-2); }
.lanehead i { width: 10px; height: 10px; border-radius: 50%; }
.grad { height: 4px; border-radius: 2px; margin: 4px 0 2px; }
.ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
/* tooltip */
.tip { position: fixed; pointer-events: none; background: var(--panel); border-radius: 12px; padding: 10px 12px; box-shadow: 0 10px 30px rgba(16,24,40,.18);
  display: none; z-index: 9; font-size: 13px; color: var(--ink-2); max-width: 300px; }
.tip b { color: var(--ink); font-weight: 600; }
.tip img { width: 200px; height: 200px; display: block; border-radius: 8px; margin-top: 8px; }
.tip .bar { display: grid; grid-template-columns: 64px 1fr; gap: 4px 8px; margin-top: 6px; align-items: center; }
</style>
</head>
<body>
<header>
  <h1>Default Audit</h1>
  <div class="pill"><i style="background:var(--a)"></i><select id="selA"></select></div>
  <button class="iconbtn" id="swap" title="swap">⇄</button>
  <div class="pill"><i style="background:var(--b)"></i><select id="selB"></select></div>
  <div class="diff" id="diff"></div>
  <div class="seg" id="aspSeg"></div>
  <div class="status" id="status"></div>
</header>
<main id="app">
  <section class="card" id="mapCard"><h2>Configurations</h2><div class="body" id="map"></div></section>
  <section class="card" id="matrixCard"><h2>Subjects <small>× configurations</small></h2><div class="body" id="matrix"></div></section>
  <section class="card" id="stripCard"><h2 id="stripName"></h2><div class="body" id="strip"></div></section>
  <section class="card" id="ridgeCard"><h2><span id="subjName"></span><select id="selS"></select></h2><div class="body" id="ridge"></div></section>
  <aside id="side"></aside>
</main>
<div class="tip" id="tip"></div>
<script src="d3.min.js"></script>
<script src="data.js"></script>
<script>
"use strict";
const ASP = META.aspects, RET = ASP.filter(a => a.retained), AIDX = Object.fromEntries(ASP.map((a, i) => [a.key, i]));
const SUBJ = META.subjects, G = Object.fromEntries(META.groups.map(g => [g.id, g]));
const M_LOC = META.margins.location, M_LR = META.margins.log_iqr, NBOOT = 400, DUR = 450;
const st = { A: null, B: null, aspect: RET[0].key, subj: 0, hover: null, hoverCfg: null, job: null };
const cur = () => st.hover ?? st.subj;
const poleWord = t => t.replace(/^(a |an )/, "").replace(/ (colors|tones|light|background|from far away|with .*|in a .*)$/, "").split(" ").slice(-2).join(" ");
const aspName = k => k === "sat" ? "saturation" : k === "bg" ? "background" : k;
const box = sel => { const n = d3.select(sel).node(); return { w: n.clientWidth, h: n.clientHeight }; };
const fd = d3.format("+.2f"), fr = v => "×" + d3.format(".2f")(Math.exp(v)), f2 = d3.format(".2f");

// ---------------- statistics ----------------
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const q = (s, p) => d3.quantileSorted(s, p);
function mi(v) { const s = Float64Array.from(v).sort(); return { med: q(s, .5), iqr: q(s, .75) - q(s, .25) }; }
function contrast() {
  const A = st.A, B = st.B, paired = G[A].settings.weights === G[B].settings.weights, R = {};
  for (const a of ASP) {
    const ai = 3 + AIDX[a.key], sc = META.scale[a.key], cells = [];
    SUBJ.forEach((s, si) => {
      if (s.excluded.includes(a.key)) return;
      const ra = SCORES[A][si], rb = SCORES[B][si];
      if (!ra?.length || !rb?.length) return;
      const xa = ra.map(r => r[ai]), xb = rb.map(r => r[ai]), sa = mi(xa), sb = mi(xb);
      const rand = rng(1009 * si + 7 * AIDX[a.key] + 1), bd = new Float64Array(NBOOT), bl = new Float64Array(NBOOT);
      const byK = paired ? new Map(rb.map(r => [r[0], r[ai]])) : null;
      for (let b = 0; b < NBOOT; b++) {
        const pa = [], pb = [];
        for (let i = 0; i < xa.length; i++) { const j = Math.floor(rand() * xa.length); pa.push(xa[j]); if (paired) pb.push(byK.get(ra[j][0])); }
        if (!paired) for (let i = 0; i < xb.length; i++) pb.push(xb[Math.floor(rand() * xb.length)]);
        const ba = mi(pa), bb = mi(pb); bd[b] = (bb.med - ba.med) / sc; bl[b] = Math.log(bb.iqr / ba.iqr);
      }
      const sd = Float64Array.from(bd).sort(), sl = Float64Array.from(bl).sort();
      cells.push({ si, d: (sb.med - sa.med) / sc, lr: Math.log(sb.iqr / sa.iqr), dlo: q(sd, .05), dhi: q(sd, .95), llo: q(sl, .05), lhi: q(sl, .95), bd, bl });
    });
    const cats = d3.group(cells, c => SUBJ[c.si].category), rand = rng(31 + AIDX[a.key]), pd = [], pl = [];
    for (let b = 0; b < NBOOT; b++) {
      const vd = [], vl = [];
      for (const cs of cats.values()) for (let i = 0; i < cs.length; i++) { const c = cs[Math.floor(rand() * cs.length)]; vd.push(c.bd[b]); vl.push(c.bl[b]); }
      pd.push(d3.median(vd)); pl.push(d3.median(vl));
    }
    pd.sort((x, y) => x - y); pl.sort((x, y) => x - y);
    R[a.key] = { cells, pool: { d: d3.median(cells, c => c.d), lr: d3.median(cells, c => c.lr), dlo: q(pd, .05), dhi: q(pd, .95), llo: q(pl, .05), lhi: q(pl, .95) } };
  }
  return R;
}
const verdict = (lo, hi, m) => lo > -m && hi < m ? "same" : (lo >= m || hi <= -m) ? "moved" : "unclear";

// ---------------- header ----------------
function header() {
  st.A = G.G07_klein_base4b_cfg1 ? "G07_klein_base4b_cfg1" : META.groups[0].id;
  st.B = G.G06_klein_base4b_cfg4 ? "G06_klein_base4b_cfg4" : META.groups[1].id;
  for (const [id, key] of [["#selA", "A"], ["#selB", "B"]]) {
    d3.select(id).selectAll("option").data(META.groups).join("option").attr("value", g => g.id).text(g => g.label);
    d3.select(id).property("value", st[key]).on("change", e => { st[key] = e.target.value; update(); });
  }
  d3.select("#swap").on("click", () => setPair(st.B, st.A));
  d3.select("#selS").selectAll("optgroup").data(d3.groups(SUBJ.map((s, i) => ({ ...s, i })), s => s.category)).join("optgroup")
    .attr("label", ([c]) => c).selectAll("option").data(([, ss]) => ss).join("option").attr("value", s => s.i).text(s => s.name);
  d3.select("#selS").on("change", e => pick(+e.target.value, st.aspect));
  if (META.scale_provisional) {
    const s = d3.select("#status").attr("title", `Scale is provisional: computed from ${META.groups.length} of ${META.all_groups} configurations.`);
    s.append("i"); s.append("span").text(`${META.groups.length} / ${META.all_groups}`);
  }
}
function aspectSeg() {
  d3.select("#aspSeg").selectAll("button").data(RET).join("button").text(a => aspName(a.key))
    .classed("on", a => a.key === st.aspect).on("click", (e, a) => pick(st.subj, a.key));
}
function diffChips() {
  const a = G[st.A].settings, b = G[st.B].settings;
  const keys = [...new Set([...Object.keys(a), ...Object.keys(b)])].filter(k => String(a[k]) !== String(b[k]) && k !== "pipeline");
  const tail = v => String(v ?? "–").split("/").pop().replace(/^guidance_scale = |^true_cfg_scale = /, "");
  keys.sort((p, r) => (r === "weights") - (p === "weights"));
  const chips = keys.map(k => ({ cls: "", title: k, text: `${tail(a[k])} → ${tail(b[k])}` }));
  if (keys.length > 1) chips.unshift({ cls: "warn", title: `${keys.length} declared settings differ: the difference cannot be attributed to one of them`, text: `⚠ ${keys.length}` });
  d3.select("#diff").selectAll("span").data(chips).join("span").attr("class", c => c.cls).attr("title", c => c.title).text(c => c.text);
}

// ---------------- main view: configuration map ----------------
const FAMC = { "Stable Diffusion": "#6b7a8f", "FLUX.2": "#2f9e8f", "Qwen-Image": "#c2577a" };
const SHORT = { G01: "SD1.5", G02: "SDXL", G03: "Turbo", G04: "SD3.5", G05: "dev", G06: "kb4·4", G07: "kb4·1", G08: "k4",
  G09: "Qw·4", G10: "Qw·1", G11: "kb9", G12: "k9" };
const ORDER = ["G01", "G02", "G03", "G04", "G05", "G11", "G12", "G06", "G07", "G08", "G09", "G10"];
const ARROWS = [["G07", "G06", "guidance"], ["G10", "G09", "guidance"], ["G07", "G08", "package"], ["G02", "G03", "package"], ["G11", "G12", "package"]];
const CFGS = ORDER.map(p => META.groups.find(g => g.id.startsWith(p))).filter(Boolean);
const byPrefix = p => CFGS.find(g => g.id.startsWith(p));
const famColor = g => FAMC[g.family] || "var(--dot)";
let OV = null;
const OVS = {};
// typical location and spread of each configuration on one aspect: per subject, location is the distance of the
// configuration's median from the median of all configurations' medians (scale units), spread is its IQR (scale units);
// the map places each configuration at the median over subjects
function overview(aspect) {
  const ai = 3 + AIDX[aspect], sc = META.scale[aspect], per = new Map(CFGS.map(g => [g.id, []]));
  SUBJ.forEach((s, si) => {
    if (s.excluded.includes(aspect)) return;
    const m = CFGS.map(g => ({ g: g.id, ...mi(SCORES[g.id][si].map(r => r[ai])) }));
    const center = d3.median(m, d => d.med);
    m.forEach(d => per.get(d.g).push({ si, x: (d.med - center) / sc, y: d.iqr / sc }));
  });
  return CFGS.map(g => { const p = per.get(g.id); return { g, x: d3.median(p, d => d.x), y: d3.median(p, d => d.y), per: p }; });
}
function buildMap() {
  const host = d3.select("#map"); host.selectAll("*").remove();
  const { w: W, h: H } = box("#map"), m = { l: 22, r: 22, t: 22, b: 30 };
  const svg = host.append("svg").attr("width", W).attr("height", H);
  const defs = svg.append("defs");
  defs.append("marker").attr("id", "ah").attr("viewBox", "0 0 10 10").attr("refX", 8).attr("refY", 5).attr("markerWidth", 7).attr("markerHeight", 7)
    .attr("orient", "auto-start-reverse").append("path").attr("d", "M 0 1 L 9 5 L 0 9 z").attr("fill", "var(--ink-2)");
  defs.append("clipPath").attr("id", "mapclip").append("rect").attr("x", m.l - 12).attr("y", m.t - 12).attr("width", W - m.l - m.r + 24).attr("height", H - m.t - m.b + 24);
  Object.assign(OVS, { svg, W, H, m, x: d3.scaleLinear().range([m.l, W - m.r]), y: d3.scaleLinear().range([H - m.b, m.t]) });
  OVS.zx = svg.append("line").attr("class", "zero");
  OVS.pl = svg.append("text").attr("class", "pole").attr("y", H - 8).attr("x", m.l);
  OVS.pr = svg.append("text").attr("class", "pole").attr("y", H - 8).attr("x", W - m.r).attr("text-anchor", "end");
  svg.append("text").attr("class", "pole").attr("x", m.l).attr("y", m.t - 6).text("wider");
  svg.append("text").attr("class", "pole").attr("x", m.l).attr("y", H - m.b - 6).text("tighter");
  const plot = svg.append("g").attr("clip-path", "url(#mapclip)");
  OVS.detail = plot.append("g").attr("class", "detail");
  OVS.arrows = plot.append("g");
  OVS.pts = plot.append("g");
  OVS.labs = svg.append("g");
}
function drawMap(animate) {
  OV = overview(st.aspect);
  const a = ASP[AIDX[st.aspect]], { x, y, m, W, H } = OVS, t = d3.transition().duration(animate ? DUR : 0).ease(d3.easeCubicInOut);
  // domain: every configuration with room for its label, and most per-subject positions (80th percentile);
  // the rest are drawn at the edge as triangles (overviewHL)
  const allX = OV.flatMap(d => d.per.map(p => Math.abs(p.x))).sort(d3.ascending), allY = OV.flatMap(d => d.per.map(p => p.y)).sort(d3.ascending);
  const xm = Math.max(.8, d3.max(OV, d => Math.abs(d.x)) * 1.35, d3.quantileSorted(allX, .8));
  const ym = Math.max(.8, d3.max(OV, d => d.y) * 1.25, d3.quantileSorted(allY, .8));
  x.domain([-xm, xm]); y.domain([0, ym]);
  OVS.zx.transition(t).attr("x1", x(0)).attr("x2", x(0)).attr("y1", m.t).attr("y2", H - m.b);
  OVS.pl.text(poleWord(a.left)); OVS.pr.text(poleWord(a.right));
  const pos = Object.fromEntries(OV.map(d => [d.g.id, [x(d.x), y(d.y)]]));
  const arr = ARROWS.map(([f, to, kind]) => ({ f: byPrefix(f), to: byPrefix(to), kind })).filter(d => d.f && d.to);
  const curve = d => {
    const [x1, y1] = pos[d.f.id], [x2, y2] = pos[d.to.id], dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
    const sx = x1 + dx / len * Math.min(10, len / 2 - 1), sy = y1 + dy / len * Math.min(10, len / 2 - 1), ex = x2 - dx / len * 11, ey = y2 - dy / len * 11;
    const cx = (sx + ex) / 2 - dy * .12, cy = (sy + ey) / 2 + dx * .12;
    return `M${sx},${sy} Q${cx},${cy} ${ex},${ey}`;
  };
  OVS.arrows.selectAll("g.arrow").data(arr, d => d.f.id + d.to.id).join(en => {
    const g = en.append("g").attr("class", d => "arrow " + d.kind);
    g.append("path").attr("class", "shaft").attr("marker-end", "url(#ah)"); g.append("path").attr("class", "hit");
    g.on("mousemove", (e, d) => showTip(e, `<b>${G[d.f.id].label} → ${G[d.to.id].label}</b><br>${d.kind === "guidance" ? "guidance only" : "package: several settings change"}`))

  lane.select(".lanehead span").text(l => G[l.g].label);
  lane.select(".lane").style("grid-template-columns", `repeat(${cols}, minmax(0, 1fr))`)
    .selectAll("img").data(l => l.rows.map(r => ({ g: l.g, r })), d => d.g + d.r[2]).join("img")
    .attr("src", d => `thumbs/${d.g}/${d.r[2]}.jpg`).attr("alt", "").attr("data-j", d => d.r[2])
    .on("mouseenter", (e, d) => { st.job = d.r[2]; markJob(); })
    .on("mousemove", (e, d) => showTip(e, imgTip(d.g, d.r)))
    .on("mouseleave", hideTip)
    .order();
  const ends = d3.select("#strip").selectAll("div.endwrap").data([a]).join(en => {
    const w = en.append("div").attr("class", "endwrap");
    w.append("div").attr("class", "grad").style("background", "linear-gradient(90deg,var(--faint),var(--ink-2))");
    const e2 = w.append("div").attr("class", "ends"); e2.append("span").attr("class", "l"); e2.append("span").attr("class", "r");
    return w;
  });
  ends.select(".l").text(d => poleWord(d.left)); ends.select(".r").text(d => poleWord(d.right));
  markJob();
}
function markJob() {
  d3.selectAll(".lane img").classed("hl", d => d.r[2] === st.job);
  d3.selectAll(".rug").classed("hl", function () { return this.dataset.j === st.job && this.parentNode.style.opacity === "1"; })
    .filter(function () { return this.dataset.j === st.job; }).raise();
}
function imgTip(g, r) { return `<b>${G[g].label}</b> · seed ${r[1]}<img src="thumbs/${g}/${r[2]}.jpg" alt="">`; }

// ---------------- tooltip ----------------
function showTip(e, html) {
  const t = d3.select("#tip").html(html).style("display", "block"), n = t.node();
  t.style("left", Math.min(e.clientX + 16, innerWidth - n.offsetWidth - 10) + "px")
   .style("top", Math.min(e.clientY + 16, innerHeight - n.offsetHeight - 10) + "px");
}
function hideTip() { d3.select("#tip").style("display", "none"); }

// ---------------- init and responsive layout ----------------
let R = null;
function update() { diffChips(); R = contrast(); drawScatters(true); drawMap(true); }
function layout() { buildMap(); buildScatters(); drawScatters(false); drawMap(false); }
header(); aspectSeg(); buildMap(); buildScatters(); update();
let rt = null;
new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(layout, 120); }).observe(document.getElementById("app"));
</script>
